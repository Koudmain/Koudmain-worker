repos:
  - repo: local
    hooks:
      - id: go-format
        name: 🎨 Format Go project
        entry: golangci-lint fmt
        language: system
        types: [go]
        pass_filenames: false

  - repo: local
    hooks:
      - id: go-linter
        name: 🔍 Lint Go project
        entry: golangci-lint run
        language: system
        types: [go]
        pass_filenames: false

  - repo: local
    hooks:
      - id: betterleaks-docker
        name: 🔒 Detect hardcoded secrets
        description: Detect hardcoded secrets using Betterleaks
        entry: ghcr.io/betterleaks/betterleaks:latest git --pre-commit --redact --staged --verbose
        language: docker_image
        pass_filenames: false
