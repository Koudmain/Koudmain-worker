name: "CI"

on:
  pull_request:
    types: [labeled]
  push:
    branches: [main, dev]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  force-ci:
    name: "Force CI"
    if: github.event_name == 'push' || (github.event.action == 'labeled' && (github.event.label.name == 'force ci' || github.event.label.name == 'to merge'))
    uses: Koudmain/.github/.github/workflows/orchestrator-ci.yml@main
    permissions:
      pull-requests: write
    with:
      language: "go"
      # Same as go.mod: with "stable" (1.27), golangci-lint v2.12 cannot read the export data.
      go-version: "1.26.3"
      run-tests: true
      run-precommit: true
    secrets: inherit

  label-cleanup:
    name: "Label cleanup"
    needs: [force-ci]
    if: always() && (github.event_name == 'push' || (github.event.action == 'labeled' && (github.event.label.name == 'force ci' || github.event.label.name == 'to merge')))
    uses: Koudmain/.github/.github/workflows/reusable-label-cleanup.yml@main
    permissions:
      pull-requests: write
    with:
      ci-failed: ${{ contains(needs.*.result, 'failure') }}
    secrets: inherit
